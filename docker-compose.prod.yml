services:
  db:
    image: postgres:16-alpine
    container_name: asala_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-asalahub}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-asalahub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asala_backend_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/asalahub}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-http://localhost:3000}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-asala_hub_prod_secret_key_928374928374}
      - ENVIRONMENT=production
      - CAMPUS_MODE=${CAMPUS_MODE:-false}
      - AUTO_SEED=${AUTO_SEED:-false}
    volumes:
      - backend_uploads_prod:/app/uploads
      - backups_prod:/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  db-backup:
    image: postgres:16-alpine
    container_name: asala_db_backup_prod
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-asalahub}
      - RETENTION_DAYS=${RETENTION_DAYS:-14}
    volumes:
      - backups_prod:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        /scripts/backup.sh &&
        echo '0 2 * * * /scripts/backup.sh >> /var/log/cron.log 2>&1' > /etc/crontabs/root &&
        crond -f -d 8
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: asala_frontend_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data_prod:
  backend_uploads_prod:
  backups_prod:
