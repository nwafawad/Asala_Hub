services:
  db:
    image: postgres:16-alpine
    container_name: asala_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-asalahub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-asalahub}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asala_backend
    restart: always
    volumes:
      - ./backend:/app
      - ./backups:/backups
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/asalahub}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-http://localhost:3000,http://127.0.0.1:3000}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-asala_hub_dev_secret_key_129384729384}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CAMPUS_MODE=${CAMPUS_MODE:-false}
      - AUTO_SEED=${AUTO_SEED:-false}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  db-backup:
    image: postgres:16-alpine
    container_name: asala_db_backup
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-asalahub}
      - RETENTION_DAYS=${RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        /scripts/backup.sh &&
        echo '0 2 * * * /scripts/backup.sh >> /var/log/cron.log 2>&1' > /etc/crontabs/root &&
        crond -f -d 8
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: asala_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - WATCHPACK_POLLING=true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
