version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: asala_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asala_backend
    restart: always
    volumes:
      - ./backend:/app
      - ./backups:/backups
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - BACKUP_STATUS_FILE=/backups/last_backup_status.json
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  db-backup:
    image: postgres:16-alpine
    container_name: asala_db_backup
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-asalahub}
      - RETENTION_DAYS=14
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        /scripts/backup.sh &&
        echo '0 2 * * * /scripts/backup.sh >> /var/log/cron.log 2>&1' > /etc/crontabs/root &&
        crond -f -d 8
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asala_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:

